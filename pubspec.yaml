name: toefl_prep
description: "Prep Simulator for TOEFL: TOEFL iBT mock tests, practice and lessons by HomiLabs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  google_mobile_ads: ^9.2.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^6.2.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
